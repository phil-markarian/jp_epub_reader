# Seed catalog of known Yomitan dictionaries.
#
# Each entry is matched against a freshly-imported dictionary's
# index.json `title` field. If a match hits AND the field in
# question is empty on the imported row, we fill it in. User-set
# values are NEVER overwritten — same for fields the import already
# captured from index.json. The catalog is purely additive.
#
# Matching:
#   - `name` is the canonical dictionary name. Matched
#     case-insensitively, after stripping common prefixes
#     ([JA-JA] / [Monolingual] / [Pitch] etc.) and bracketed
#     version suffixes ([2025-08-18]).
#   - `aliases` is an optional list of additional substrings; if
#     any appear in the normalized title it counts as a match.
#
# To extend: just append a new [[entry]] table. No code changes
# needed — `catalog::lookup` reads this file at startup via
# include_str!.

# ─────────────────────────────────────────────────────────────────────
# Monolingual (国語辞典)
# ─────────────────────────────────────────────────────────────────────

[[entry]]
name = "大辞林"
kind = "word"
description = """A premier Japanese-Japanese 国語辞典 published by Sanseidō.
Comprehensive headword coverage with carefully written, scholarly definitions.
Very common pick for serious Japanese learners; pairs well with 大辞泉 for
cross-checking nuance."""
url = "https://www.sanseido-publ.co.jp/publ/dicts/daijirin4.html"
attribution = "Sanseidō Publishing"

[[entry]]
name = "大辞泉"
kind = "word"
description = """A major 国語辞典 published by Shogakukan, available digitally as
デジタル大辞泉 with continual updates for modern usage including loanwords and
internet vocabulary."""
url = "https://daijisen.jp/"
attribution = "Shogakukan"

[[entry]]
name = "新明解国語辞典"
kind = "word"
aliases = ["新明解"]
description = """国語辞典 from Sanseidō with definitions famous for being more
opinionated and prescriptive than competitors — strong on capturing nuance and
register. Heavily quoted in writing-style discussions."""
attribution = "Sanseidō Publishing"

[[entry]]
name = "明鏡国語辞典"
kind = "word"
aliases = ["明鏡"]
description = """国語辞典 from Taishukan focused on contemporary written Japanese.
Strong example sentences and clear distinctions between near-synonyms."""
attribution = "Taishukan"

[[entry]]
name = "岩波国語辞典"
kind = "word"
description = """Conservative 国語辞典 from Iwanami Shoten with a long pedigree.
Particularly well-regarded for classical and literary vocabulary; some entries
quote Meiji-era usage."""
attribution = "Iwanami Shoten"

[[entry]]
name = "現代国語例解辞典"
kind = "word"
description = """Example-sentence-heavy 国語辞典 from Shogakukan. Each entry
emphasizes how words actually appear in context, with usage notes on
collocations and register."""
attribution = "Shogakukan"

[[entry]]
name = "小学館例解学習国語辞典"
kind = "word"
description = """Shogakukan's learner-focused 国語辞典, originally aimed at
Japanese primary-school students. Definitions are written in plain Japanese,
which often makes it the most approachable monolingual option for L2 learners."""
attribution = "Shogakukan"

[[entry]]
name = "国語辞典オンライン"
kind = "word"
description = """Open online 国語辞典. Coverage skews toward modern everyday
vocabulary; useful as a cross-check when the formal kokugo dicts disagree or
omit a recent term."""

[[entry]]
name = "実用日本語表現辞典"
kind = "word"
description = """Modern usage dictionary covering colloquial phrases, internet
slang, and set expressions that the traditional kokugo dicts may not include."""

[[entry]]
name = "故事ことわざの辞典"
kind = "word"
description = """Dictionary of Japanese proverbs (ことわざ) and four-character
idioms (四字熟語), with origins and usage notes for each entry."""

[[entry]]
name = "ハイブリッド新辞林"
kind = "word"
description = """Combined kokugo + kanji + idiom dictionary from Sanseidō,
notable for breadth across word types in one lookup."""
attribution = "Sanseidō Publishing"

[[entry]]
name = "ことわざ・慣用句の百科事典"
kind = "word"
description = """Encyclopedia-style reference for Japanese proverbs and idiomatic
expressions, with longer explanatory entries than a typical 国語辞典."""

[[entry]]
name = "使い方の分かる類語例解辞典"
kind = "word"
description = """Thesaurus from Shogakukan focused on usage distinctions between
near-synonyms. Each entry contrasts the listed words with concrete examples."""
attribution = "Shogakukan"

# ─────────────────────────────────────────────────────────────────────
# Bilingual JA-EN / EN-JA
# ─────────────────────────────────────────────────────────────────────

[[entry]]
name = "JMdict"
kind = "word"
description = """The community-built Japanese-English dictionary maintained by
the Electronic Dictionary Research and Development Group (EDRDG). De-facto
standard JA→EN lookup; entries include parts of speech, multiple readings, and
extensive cross-references."""
url = "https://www.edrdg.org/jmdict/j_jmdict.html"
attribution = "EDRDG"

[[entry]]
name = "JMdict Forms"
kind = "word"
description = """Companion bank for JMdict providing alternative kanji surface
forms (旧字体, hiragana-only forms, etc.) that map to the same headword."""
url = "https://www.edrdg.org/jmdict/j_jmdict.html"
attribution = "EDRDG"

[[entry]]
name = "JMdict (Legacy)"
kind = "word"
description = """Older snapshot of JMdict with the simpler structured-content
format. Useful when newer JMdict entries render poorly in the popup."""
url = "https://www.edrdg.org/jmdict/j_jmdict.html"
attribution = "EDRDG"

[[entry]]
name = "JMnedict"
kind = "name"
description = """JMdict's companion proper-noun dictionary: people's names,
place names, organizations, fictional characters. Indispensable when reading
fiction that names lots of characters or settings."""
url = "https://www.edrdg.org/enamdict/enamdict_doc.html"
attribution = "EDRDG"

[[entry]]
name = "新和英"
kind = "word"
description = """Japanese→English dictionary; one of several widely-circulated
re-packs based on classical translation pairings. Coverage is broader than
JMdict for literary and formal vocabulary."""

[[entry]]
name = "NEW斎藤和英大辞典"
kind = "word"
aliases = ["斎藤和英"]
description = """斎藤和英大辞典: classical Japanese-English dictionary by Saitō
Hidesaburō. Famous for elegant English renderings of formal and literary
Japanese. Public domain, originally published 1928."""
attribution = "Saitō Hidesaburō (public domain)"

# ─────────────────────────────────────────────────────────────────────
# Kanji
# ─────────────────────────────────────────────────────────────────────

[[entry]]
name = "漢字源"
kind = "kanji"
description = """Mainstream kanji dictionary from Gakken with stroke counts,
radicals, on/kun readings, and compound examples. Heavy on character-formation
analysis (form / sound / meaning)."""
attribution = "Gakken"

[[entry]]
name = "KANJIDIC"
kind = "kanji"
description = """The standard machine-readable kanji dictionary maintained by
EDRDG. Lists every Jōyō and most secondary-use kanji with readings, meanings,
JLPT level, stroke counts, and radical indices."""
url = "https://www.edrdg.org/wiki/index.php/KANJIDIC_Project"
attribution = "EDRDG"

# ─────────────────────────────────────────────────────────────────────
# Frequency
# ─────────────────────────────────────────────────────────────────────

[[entry]]
name = "Innocent Ranked"
kind = "frequency"
description = """Frequency dictionary derived from a large corpus of Japanese
fiction. The "ranked" version assigns each word a rank instead of a raw count,
which lookups can use as a difficulty signal."""

