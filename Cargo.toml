[workspace]
resolver = "2"
members = [
    "frontend",
    "src-tauri",
    "crates/jp-core",
    "crates/jp-tokenizer",
    "crates/jp-dict",
    "crates/jp-vocab",
    "crates/jp-anki",
    "crates/jp-importer",
    "crates/jp-reader",
    # Phase 9+
    # "crates/jp-llm",
    # "crates/jp-ocr",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Phil M."]
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream", "gzip", "hickory-dns"] }
encoding_rs = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
csv = "1.3"
