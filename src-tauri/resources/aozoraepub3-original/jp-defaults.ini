# Defaults applied by the JP EPUB Reader app on every Aozora import.
# Loaded via `-i jp-defaults.ini` from jar::run. Anything not set here
# falls back to the jar's compiled-in defaults.

# 縦中横 (tate-chū-yoko): rotate short Latin/digit runs upright in
# vertical text. Closer to how a Japanese reader expects the page.
AutoYoko=1
AutoYokoNum1=0
AutoYokoNum3=0
AutoYokoEQ1=1
